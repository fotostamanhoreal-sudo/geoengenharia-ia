<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geoengenharia IA: soluções de terreno para data centers</title>
<meta name="description" content="Geoengenharia para data centers: seleção de terreno, investigação geotécnica, fundações, hidrologia, aterramento e monitoramento com inteligência artificial.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F2ED;--sf:#fff;--ink:#15191F;--mu:#566070;--ln:#DAD6CC;--ac:#0B7A85;--on:#fff;--s1:#D9BE98;--s2:#9A6440;--s3:#8B96A3;--s4:#4A5565;--x1:#15191F;--x2:#fff;--x3:#15191F;--x4:#fff;--ok:#1B8A4B;--wn:#B7791F;--bd:#C2410C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141A;--sf:#181E27;--ink:#EEF1F6;--mu:#A3ADBD;--ln:#2B3440;--ac:#4FC3CF;--on:#10141A;--s1:#7A6446;--s2:#7A4F36;--s3:#4F5B6A;--s4:#29303B;--x1:#F2F4F8;--x2:#F2F4F8;--x3:#F2F4F8;--x4:#F2F4F8;--ok:#4ADE80;--wn:#FBBF24;--bd:#FB923C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141A;--sf:#181E27;--ink:#EEF1F6;--mu:#A3ADBD;--ln:#2B3440;--ac:#4FC3CF;--on:#10141A;--s1:#7A6446;--s2:#7A4F36;--s3:#4F5B6A;--s4:#29303B;--x1:#F2F4F8;--x2:#F2F4F8;--x3:#F2F4F8;--x4:#F2F4F8;--ok:#4ADE80;--wn:#FBBF24;--bd:#FB923C;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 "IBM Plex Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,.brand,.btn,.tab,summary{font-family:Archivo,system-ui,sans-serif}
.w{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--ln)}
header .w{display:flex;align-items:center;gap:16px;height:58px}
.brand{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:9px;flex:none;color:var(--ink);text-decoration:none}
.lg{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--ac),#0A5F68);display:grid;place-items:center;color:#fff;font-size:.75rem;font-weight:800}
nav{display:flex;gap:4px;overflow:auto;flex:1;scrollbar-width:none}
nav a{color:var(--mu);text-decoration:none;padding:8px 10px;border-radius:8px;font-size:.9rem;white-space:nowrap}
nav a:hover,nav a[aria-current="page"]{background:var(--sf);color:var(--ink)}
.theme{border:1px solid var(--ln);background:var(--sf);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
main{padding:28px 0 60px}
.hero{display:grid;gap:22px;grid-template-columns:1.2fr .8fr;align-items:center;margin-bottom:40px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.15;margin:0 0 12px}
.hero p{color:var(--mu);max-width:52ch;margin:0 0 18px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:10px;font-weight:700;text-decoration:none;border:1.5px solid transparent;cursor:pointer;font-size:.95rem}
.btn.p{background:var(--ac);color:var(--on)}
.btn.s{background:var(--sf);border-color:var(--ln);color:var(--ink)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
section{margin:48px 0}
h2{font-size:1.45rem;margin:0 0 14px}
.muted{color:var(--mu)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:8px 12px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;font-size:.9rem}
.tab[aria-selected="true"]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.panel{display:none}.panel.active{display:block}
footer{margin-top:60px;border-top:1px solid var(--ln);padding:28px 0;color:var(--mu);font-size:.92rem}
/* truncated for tool call - full content will be handled in next step if needed */
</style>
</head>
<body>

</html>
